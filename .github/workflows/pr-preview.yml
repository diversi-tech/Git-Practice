name: Pull Request Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing open pull request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout prospective merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate branch data
        run: npm run gen-branches

      - name: Build
        run: npm run build

      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          cd pages

          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git checkout -b gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          preview_dir="pr-preview/pr-${PR_NUMBER}"
          rm -rf "${preview_dir}"
          mkdir -p "${preview_dir}"
          cp -R ../dist/. "${preview_dir}/"
          touch .nojekyll

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all

          if ! git diff --cached --quiet; then
            git commit -m "Deploy preview for PR #${PR_NUMBER}"
            git push origin gh-pages
          fi

      - name: Add preview link to pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://diversi-tech.github.io/Git-Practice/pr-preview/pr-${{ env.PR_NUMBER }}/
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- git-practice-preview -->';
            const body = `${marker}\n## GitHub Pages preview\n\n${process.env.PREVIEW_URL}\n\nThis preview contains the prospective merge result.`;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

  remove:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Remove preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          cd pages

          if ! git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            exit 0
          fi

          git checkout -b gh-pages origin/gh-pages
          rm -rf "pr-preview/pr-${PR_NUMBER}"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all

          if ! git diff --cached --quiet; then
            git commit -m "Remove preview for PR #${PR_NUMBER}"
            git push origin gh-pages
          fi
