name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate branch data
        run: npm run gen-branches

      - name: Build
        run: npm run build

      - name: Publish production site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          cd pages

          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git checkout -b gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name pr-preview \
            -exec rm -rf {} +
          cp -R ../dist/. .
          touch .nojekyll

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all

          if ! git diff --cached --quiet; then
            git commit -m "Deploy production site from ${GITHUB_SHA}"
            git push origin gh-pages
          fi
